apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: payment-session-worker-admin
  namespace: prod-payments
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: payment-session-worker-admin-binding
  namespace: prod-payments
subjects:
  - kind: ServiceAccount
    name: default
    namespace: prod-payments
roleRef:
  kind: Role
  name: payment-session-worker-admin
  apiGroup: rbac.authorization.k8s.io
