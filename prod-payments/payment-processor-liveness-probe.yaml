apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-processor
  namespace: prod-payments
spec:
  template:
    spec:
      containers:
      - name: app
        image: your-docker-image:latest
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5