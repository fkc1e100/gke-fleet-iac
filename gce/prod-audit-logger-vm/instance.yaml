apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeInstance
metadata:
  name: prod-audit-logger-vm
  namespace: prod-analytics
  labels:
    cost-center: "finops-analytics-707"
    owner: "data-team"
spec:
  zone: us-central1-a
  machineType: e2-standard-4
  bootDisk:
    initializeParams:
      image: debian-cloud/debian-11
      size: 10
  networkInterface:
    - networkRef:
        name: default
  metadata:
    startup-script: |
      #!/bin/bash
      echo "Simulating unrotated log file growth..."
      dd if=/dev/zero of=/var/log/audit-spool.log bs=1M count=9500
      systemctl restart systemd-journald
