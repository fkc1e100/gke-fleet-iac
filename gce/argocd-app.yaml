apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gce-infrastructure-fleet
  namespace: argocd
  annotations:
    description: "ArgoCD GitOps Application continuously reconciling GCE VM Compute Infrastructure via Config Connector (KCC)."
spec:
  project: default
  source:
    repoURL: 'https://github.com/fkc1e100/org-mono-repo.git'
    targetRevision: HEAD
    path: gce
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
