apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeInstance
metadata:
  name: prod-legacy-auth-vm
  namespace: prod-auth
  labels:
    cost-center: "finops-auth-202"
    owner: "security-team"
spec:
  zone: us-central1-a
  machineType: e2-standard-2
  bootDisk:
    initializeParams:
      image: ubuntu-os-cloud/ubuntu-2204-lts
      size: 20
  networkInterface:
    - networkRef:
        name: default
      accessConfig:
        - natIPRef: {}
  metadata:
    startup-script: |
      #!/bin/bash
      echo "Starting legacy auth application setup..."
      apt-get update && apt-get install -y python3-pip
      pip3 install non-existent-python-package-v99 || exit 1
      python3 -m http.server 8080
