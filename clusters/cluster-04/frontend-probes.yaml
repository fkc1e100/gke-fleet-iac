apiVersion: apps/v1
kind: Deployment
metadata:
  name: wl-04-frontend-gateway
  namespace: default
spec:
  template:
    spec:
      containers:
      - name: frontend
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
