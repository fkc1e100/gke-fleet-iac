apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge-tls-gateway
  namespace: edge-ingress
  labels:
    app.kubernetes.io/managed-by: kube-agents
    audit.kubeagents.x-k8s.io/policy: compliance-audit
    audit.kubeagents.x-k8s.io/model: gemma4
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - name: edge-wildcard-tls-cert
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge-ingress-boundary-netpol
  namespace: edge-ingress
  labels:
    app.kubernetes.io/managed-by: kube-agents
    audit.kubeagents.x-k8s.io/policy: compliance-audit
    audit.kubeagents.x-k8s.io/model: gemma4
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
