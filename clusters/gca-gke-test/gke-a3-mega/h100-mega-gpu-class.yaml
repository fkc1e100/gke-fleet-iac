apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: h100-mega-gpu-class
spec:
  # IMPORTANT: Align machineFamily with existing CUDs/Reservations
  priorities:
    - reservations:
        affinity: Specific
        specific:
          - name: h100-mega-reservation
            zones: ["us-central1-a", "us-central1-b"]
    - onDemand: true
    # Note: Requires GCP Project Whitelisting for Flex / DWS Private Preview
    - flexCud: true
  nodePoolConfig:
    machineFamily: a3-megagpu-8g
