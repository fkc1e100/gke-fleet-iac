apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-auth-service
  namespace: prod-auth
  labels:
    app.kubernetes.io/managed-by: kube-agents
    audit.kubeagents.x-k8s.io/policy: obtainability-audit
    audit.kubeagents.x-k8s.io/model: gemma4
spec:
  template:
    spec:
      containers:
      - name: app
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
