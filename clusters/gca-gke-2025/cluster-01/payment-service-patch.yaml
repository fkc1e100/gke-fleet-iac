apiVersion: apps/v1
kind: Deployment
metadata:
  name: wl-01-payment-service
  namespace: default
spec:
  template:
    spec:
      containers:
      - name: app
        env:
        - name: DATABASE_URL
          value: "postgres://db.example.com:5432/payments"
        resources:
          limits:
            memory: "512Mi"
          requests:
            memory: "256Mi"
