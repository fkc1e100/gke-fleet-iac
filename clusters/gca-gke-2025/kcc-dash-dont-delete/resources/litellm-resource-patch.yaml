apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: kubeagents-system
spec:
  template:
    spec:
      containers:
      - name: litellm
        resources:
          requests:
            cpu: 1000m
            memory: 4Gi
          limits:
            cpu: 2000m
            memory: 4Gi
