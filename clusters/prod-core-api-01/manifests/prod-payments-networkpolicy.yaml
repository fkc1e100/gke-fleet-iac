apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress-prod-payments
  namespace: prod-payments
  labels:
    app.kubernetes.io/managed-by: kube-agents
    audit.kubeagents.x-k8s.io/policy: compliance-audit
    audit.kubeagents.x-k8s.io/model: gemma4
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: prod-core
    ports:
    - protocol: TCP
      port: 8080
