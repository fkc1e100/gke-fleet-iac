apiVersion: v1
kind: Namespace
metadata:
  name: kubeagents-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-event-watcher
  namespace: kubeagents-system
  labels:
    app.kubernetes.io/name: k8s-event-watcher
    app.kubernetes.io/component: event-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-event-watcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-event-watcher
    spec:
      serviceAccountName: kubeagents-event-watcher
      tolerations:
      - operator: Exists
      containers:
      - name: event-watcher
        image: ghcr.io/gke-labs/kube-agents/platform-agent:latest
        command:
        - /usr/local/bin/k8s-event-watcher
        args:
        - --cluster-name=complex-01
        - --daemon-url=http://136.107.255.238:8642
        - --token-env=API_SERVER_KEY
        - --owner=platform
        - --reason=Failed,FailedToDrainNode,CrashLoopBackOff,BackOff,ImagePullBackOff,ErrImagePull,OOMKilled,ScaleUpFailed,FailedScheduling
        - --dedup-window=24h
        env:
        - name: API_SERVER_KEY
          value: d16fb182b167b57724a18ee2125d34cd
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeagents-event-watcher
  namespace: kubeagents-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeagents-event-watcher-role
rules:
- apiGroups: [""]
  resources: ["events", "pods", "nodes"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeagents-event-watcher-binding
subjects:
- kind: ServiceAccount
  name: kubeagents-event-watcher
  namespace: kubeagents-system
roleRef:
  kind: ClusterRole
  name: kubeagents-event-watcher-role
  apiGroup: rbac.authorization.k8s.io
