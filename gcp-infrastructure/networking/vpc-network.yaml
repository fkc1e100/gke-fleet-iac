apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeNetwork
metadata:
  name: fleet-vpc-network
  namespace: config-connector
  annotations:
    cnrm.cloud.google.com/project-id: "gca-gke-2025"
spec:
  autoCreateSubnetworks: false
  routingMode: GLOBAL
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeSubnetwork
metadata:
  name: fleet-gke-us-central1-subnet
  namespace: config-connector
  annotations:
    cnrm.cloud.google.com/project-id: "gca-gke-2025"
spec:
  region: us-central1
  networkRef:
    name: fleet-vpc-network
  ipCidrRange: 10.100.0.0/20
  privateIpGoogleAccess: true
  secondaryIpRange:
    - rangeName: pods
      ipCidrRange: 10.104.0.0/14
    - rangeName: services
      ipCidrRange: 10.108.0.0/20
