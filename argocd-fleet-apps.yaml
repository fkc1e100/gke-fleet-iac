apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gke-fleet-workloads
  namespace: argocd
  annotations:
    description: "ArgoCD GitOps Application reconciling all GKE fleet microservices and background workloads."
spec:
  project: default
  source:
    repoURL: 'https://github.com/fkc1e100/gke-fleet-iac.git'
    targetRevision: HEAD
    path: manifests/workloads
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
