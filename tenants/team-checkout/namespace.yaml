apiVersion: v1
kind: Namespace
metadata:
  name: team-checkout
  labels:
    cost-center: "finops-checkout-1024"
    owner: "checkout-sre-team"
    pod-security.kubernetes.io/enforce: "restricted"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-checkout-quota
  namespace: team-checkout
spec:
  hard:
    requests.cpu: "32"
    requests.memory: "128Gi"
    limits.cpu: "64"
    limits.memory: "256Gi"
    pods: "50"
