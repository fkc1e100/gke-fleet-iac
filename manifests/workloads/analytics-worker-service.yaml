apiVersion: v1
kind: Namespace
metadata:
  name: prod-analytics
  labels:
    cost-center: "finops-analytics-707"
    owner: "data-team"
    pod-security.kubernetes.io/enforce: "baseline"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: analytics-shared-pvc
  namespace: prod-analytics
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-worker
  namespace: prod-analytics
  labels:
    app: analytics-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics-worker
  template:
    metadata:
      labels:
        app: analytics-worker
    spec:
      initContainers:
        - name: sysctl-tweak
          image: busybox:latest
          command: ["sh", "-c", "sysctl -w net.core.somaxconn=1024"]
          securityContext:
            privileged: false
      containers:
        - name: worker
          image: google/cloud-sdk:slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Processing analytics data and syncing with Cloud Storage & GCE Telemetry Exporter..."
              gcloud storage ls gs://analytics-raw-data-2025 || echo "GCS Bucket sync failed!"
              curl -s --connect-timeout 3 http://10.128.0.99:9090/metrics || echo "WARN: GCE FinOps Telemetry Exporter unreachable!"
              sleep 3600
          env:
            - name: TELEMETRY_EXPORTER_ENDPOINT
              value: "http://10.128.0.99:9090"
          volumeMounts:
            - mountPath: /data
              name: shared-storage
      volumes:
        - name: shared-storage
          persistentVolumeClaim:
            claimName: analytics-shared-pvc
