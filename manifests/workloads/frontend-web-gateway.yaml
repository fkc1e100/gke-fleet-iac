apiVersion: v1
kind: Namespace
metadata:
  name: prod-ingress
  labels:
    cost-center: "finops-edge-606"
    owner: "edge-team"
    pod-security.kubernetes.io/enforce: "baseline"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-web-gateway
  namespace: prod-ingress
  labels:
    app: frontend-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-web
  template:
    metadata:
      labels:
        app: frontend-web
    spec:
      containers:
      - name: web
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-web-svc
  namespace: prod-ingress
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: frontend-web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-web-gateway
  namespace: prod-ingress
  labels:
spec:
  tls:
  - hosts:
    - app.example.com
    secretName: frontend-tls-cert
  rules:
  - host: app.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-web-svc
            port:
              number: 80
