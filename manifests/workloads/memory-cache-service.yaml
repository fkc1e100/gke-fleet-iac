apiVersion: v1
kind: Namespace
metadata:
  name: prod-caching
  labels:
    cost-center: "finops-cache-303"
    owner: "platform-team"
    pod-security.kubernetes.io/enforce: "baseline"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-cache-service
  namespace: prod-caching
  labels:
spec:
  replicas: 2
  selector:
    matchLabels:
      app: memory-cache-service
  template:
    metadata:
      labels:
        app: memory-cache-service
    spec:
      containers:
        - name: cache-worker
          image: python:3.9-slim
          command:
            [
              "python3",
              "-c",
              "import time; print('Allocating memory...'); x = 'A' * (512 * 1024 * 1024); time.sleep(60)",
            ]
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
