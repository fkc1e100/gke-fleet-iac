apiVersion: v1
kind: Namespace
metadata:
  name: ai-training
  labels:
    cost-center: "finops-ai-808"
    owner: "ai-research-team"
    pod-security.kubernetes.io/enforce: "baseline"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gemma-fine-tuning-job
  namespace: ai-training
  annotations:
    dws.gke.io/wait-timeout: "5s"
  labels:
spec:
  template:
    metadata:
      labels:
        app: gemma-fine-tuning-job
    spec:
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-flex: "true"
      containers:
        - name: trainer
          image: gcr.io/kaggle-gpu-images/python:latest
          command: ["python3", "-c", "print('Flex DWS Training Job')"]
