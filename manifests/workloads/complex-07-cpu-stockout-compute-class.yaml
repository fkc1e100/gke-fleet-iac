apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: cpu-hpc-compute-class
  namespace: default
  labels:
    test.kube-agents.io/workload: complex-07
    test.kube-agents.io/component: custom-compute-class
spec:
  priorities:
  - machineType: "c2-standard-60"
    spot: true
  - machineType: "c3-standard-88"
    spot: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wl-complex-07-hpc-batch-analytics
  namespace: default
  labels:
    test.kube-agents.io/workload: complex-07
    test.kube-agents.io/failure-type: CPUStockoutAutoscalingFailure
spec:
  replicas: 16
  selector:
    matchLabels:
      app: hpc-batch-analytics
  template:
    metadata:
      labels:
        app: hpc-batch-analytics
    spec:
      nodeSelector:
        cloud.google.com/compute-class: "cpu-hpc-compute-class"
      tolerations:
      - key: "cloud.google.com/gke-spot"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      containers:
      - name: analytics-worker
        image: python:3.9-slim
        command: ["python3", "-c", "import time; print('Starting High-Core CPU HPC Analytics Worker...'); time.sleep(3600)"]
        resources:
          requests:
            cpu: "56"
            memory: "200Gi"
          limits:
            cpu: "56"
            memory: "200Gi"
