apiVersion: v1
kind: Namespace
metadata:
  name: hpc-batch
  labels:
    cost-center: "finops-hpc-999"
    owner: "hpc-team"
    pod-security.kubernetes.io/enforce: "baseline"
---
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: cpu-hpc-compute-class
  namespace: hpc-batch
  labels:
spec:
  priorities:
    - machineType: "c2-standard-60"
      spot: true
    - machineType: "c3-standard-88"
      spot: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpc-batch-analytics
  namespace: hpc-batch
  labels:
spec:
  replicas: 16
  selector:
    matchLabels:
      app: hpc-batch-analytics
  template:
    metadata:
      labels:
        app: hpc-batch-analytics
    spec:
      nodeSelector:
        cloud.google.com/compute-class: "cpu-hpc-compute-class"
      tolerations:
        - key: "cloud.google.com/gke-spot"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      containers:
        - name: analytics-worker
          image: python:3.9-slim
          command:
            [
              "python3",
              "-c",
              "import time; print('Starting High-Core CPU HPC Analytics Worker...'); time.sleep(3600)",
            ]
          resources:
            requests:
              cpu: "56"
              memory: "200Gi"
            limits:
              cpu: "56"
              memory: "200Gi"
