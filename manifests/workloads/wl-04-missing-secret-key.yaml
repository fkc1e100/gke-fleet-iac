apiVersion: apps/v1
kind: Deployment
metadata:
  name: wl-04-backend-api
  namespace: default
  labels:
    test.kube-agents.io/workload: cluster-04
    test.kube-agents.io/failure-type: CreateContainerConfigError
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      containers:
      - name: api-server
        image: nginx:alpine
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: missing-db-credentials
              key: DATABASE_PASSWORD
