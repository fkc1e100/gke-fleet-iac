apiVersion: apps/v1
kind: Deployment
metadata:
  name: wl-08-spot-batch-processor
  namespace: default
  labels:
    test.kube-agents.io/workload: wl-08
    test.kube-agents.io/failure-type: SpotObtainabilityLockout
spec:
  replicas: 5
  selector:
    matchLabels:
      app: spot-batch-processor
  template:
    metadata:
      labels:
        app: spot-batch-processor
    spec:
      nodeSelector:
        cloud.google.com/gke-spot: "true"
        node.kubernetes.io/instance-type: "a2-highgpu-1g"
        topology.kubernetes.io/zone: "us-central1-a"
      containers:
      - name: processor
        image: ubuntu:22.04
        command: ["sleep", "3600"]
        resources:
          requests:
            cpu: "4"
            memory: "16Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: "16Gi"
            nvidia.com/gpu: "1"
