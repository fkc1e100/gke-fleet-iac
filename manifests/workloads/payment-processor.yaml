apiVersion: v1
kind: Namespace
metadata:
  name: prod-payments
  labels:
    cost-center: "finops-payments-101"
    owner: "payments-team"
    pod-security.kubernetes.io/enforce: "baseline"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-processor
  namespace: prod-payments
  labels:
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-processor
  template:
    metadata:
      labels:
        app: payment-processor
    spec:
      containers:
      - name: app
        image: docker.io/library/bash:latest
        env:
        - name: DATABASE_URL
          value: placeholder-value-please-update
        command:
        - /bin/sh
        - -c
        - |
          if [ -z "$DATABASE_URL" ]; then
            echo "FATAL: Mandatory environment variable DATABASE_URL is missing!"
            exit 1
          fi
          echo "Starting payment service..."
